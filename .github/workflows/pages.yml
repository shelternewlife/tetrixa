name: Build and deploy discovery site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python scripts/build.py
      - name: Validate output
        run: python scripts/validate.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  audit:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Audit Core Web Vitals and page experience with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://shelternewlife.github.io/tetrixa/en-us/
            https://shelternewlife.github.io/tetrixa/en-ca/
            https://shelternewlife.github.io/tetrixa/en-us/features/classic-gameplay/
            https://shelternewlife.github.io/tetrixa/en-us/faq/
          configPath: .github/lighthouserc.json
          runs: 3
          uploadArtifacts: true
